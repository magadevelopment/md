<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pengguna - SWALAYAN MAGA</title>
</head>
<body>
    <main class="w-full">
        <!-- Kotak dibuat siku (rounded-none / tanpa rounded) -->
        <div class="bg-white shadow-xl p-6 sm:p-8 rounded-none border border-slate-200">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-users-viewfinder text-indigo-600"></i>
                        Manajemen Akun Pengguna
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">Kelola hak akses akun Administrator dan Tamu yang masuk ke aplikasi.</p>
                </div>
            </div>

            <!-- Tombol Navigasi Tab -->
            <div class="flex border-b border-slate-200 mb-6 gap-8">
                <button onclick="window.switchTab('admin')" id="tabAdminBtn" class="pb-3 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 cursor-pointer transition">
                    <i class="fa-solid fa-shield-halved"></i> Admin <span id="countAdmin" class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                </button>
                <button onclick="window.switchTab('user')" id="tabUserBtn" class="pb-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center gap-2 cursor-pointer transition">
                    <i class="fa-solid fa-user"></i> User / Tamu <span id="countUser" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                </button>
            </div>

            <!-- Tabel Data Pengguna -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 border-b">
                            <th class="p-3 text-center w-16">No</th>
                            <th class="p-3">Email / Nama Akun</th>
                            <th class="p-3">Role / Hak Akses</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableUsersBody">
                        <tr>
                            <td colspan="4" class="text-center py-12 text-slate-400">Memuat data pengguna...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
