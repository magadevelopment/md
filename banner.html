<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Banner - MAGA SWALAYAN (Merchandising)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { display: none; }
        html { scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white p-1 shadow-inner flex items-center justify-center overflow-hidden border border-indigo-400 shrink-0">
                    <img src="maga.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wide">Manajemen Banner</h1>
                    <p class="text-[11px] sm:text-xs text-indigo-200">Maga Swalayan</p>
                </div>
            </div>
            
            <a href="pengaturan.html" class="flex items-center gap-1.5 text-xs sm:text-sm bg-indigo-700 hover:bg-indigo-800 px-3.5 py-2 font-medium transition shadow-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Kembali</span>
            </a>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 my-4 flex-grow">
        <div class="bg-white shadow-xl p-6 sm:p-8">
            
            <!-- Header Atas: Judul & Tombol Aksi (Cari, Hapus Terpilih, Tambah) -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b">
                <div class="flex items-center gap-3">
                    <h2 class="text-xl font-bold text-slate-800 tracking-wide">Manajemen Banner</h2>
                    <!-- Tombol Hapus Massal yang muncul jika ada yang dicentang -->
                    <button id="bulkDeleteBtn" onclick="deleteSelectedBanners()" class="hidden bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold py-1.5 px-3 transition shadow-sm items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-trash"></i> Hapus Terpilih
                    </button>
                </div>
                
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
                    <!-- Kolom Pencarian -->
                    <div class="relative flex-grow sm:w-72">
                        <input type="text" id="searchBanner" oninput="filterBanners()" placeholder="Cari banner..." class="w-full pl-4 pr-10 py-2 border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-slate-400"></i>
                    </div>
                    <!-- Tombol Tambah Banner -->
                    <button onclick="openBannerModal()" class="bg-indigo-900 hover:bg-indigo-800 text-white font-semibold text-sm py-2 px-4 transition shadow-sm flex items-center justify-center gap-2 cursor-pointer shrink-0">
                        Tambah Banner
                    </button>
                </div>
            </div>

            <!-- Tabel Daftar Banner -->
            <div class="overflow-x-auto min-h-[380px]">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-700 text-xs sm:text-sm border-b border-t">
                            <th class="p-3 w-10 text-center"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" class="cursor-pointer"></th>
                            <th class="p-3 w-32 font-semibold">Foto Banner</th>
                            <th class="p-3 font-semibold">Nama / Judul Banner</th>
                            <th class="p-3 w-28 font-semibold text-center">Status</th>
                            <th class="p-3 w-20 font-semibold text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bannerTableBody" class="text-xs sm:text-sm text-slate-700">
                        <tr>
                            <td colspan="5" class="text-center py-12 text-slate-400">Memuat data banner...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Bagian Paginasi (Pagination) -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-6 pt-4 border-t text-xs sm:text-sm text-slate-500">
                <div id="paginationInfo">Menampilkan 0 dari 0 data</div>
                <div class="flex items-center gap-1">
                    <button id="prevBtn" onclick="changePage(currentPage - 1)" class="px-3 py-1.5 border border-slate-300 hover:bg-slate-50 transition disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
                    <div id="pageNumbers" class="flex gap-1"></div>
                    <button id="nextBtn" onclick="changePage(currentPage + 1)" class="px-3 py-1.5 border border-slate-300 hover:bg-slate-50 transition disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Form Tambah Banner Baru -->
    <div id="bannerModal" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl shadow-2xl p-6 sm:p-8 relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-image text-indigo-600"></i> Tambah Banner Baru
                </h3>
                <button onclick="closeBannerModal()" class="text-slate-400 hover:text-slate-700 text-xl font-bold cursor-pointer">&times;</button>
            </div>

            <form id="formBannerModal" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama / Judul Banner</label>
                    <input type="text" id="inputBannerTitle" class="w-full px-4 py-2.5 border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Contoh: Promo Merdeka" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Upload Foto Banner (Kompres Otomatis &lt; 300KB)</label>
                    <input type="file" id="inputBannerImage" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-slate-300 cursor-pointer" required>
                </div>
                <div id="bannerPreviewContainer" class="hidden">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Preview Foto:</label>
                    <img id="bannerImgPreview" src="" alt="Preview" class="max-h-40 object-contain border p-1 bg-slate-50">
                </div>
                <div class="flex justify-end gap-2 pt-4 border-t">
                    <button type="button" onclick="closeBannerModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold text-sm py-2 px-4 transition cursor-pointer">Batal</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-2 px-6 transition shadow-sm cursor-pointer">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 text-xs text-slate-500 border-t bg-white mt-auto">
        &copy; 2026 MAGA SWALAYAN. All rights reserved.
    </footer>

    <!-- Script Logika Tabel, Paginasi, Status, Hapus & Kompres Gambar -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allBanners = [];
        let filteredBanners = [];
        let currentPage = 1;
        const rowsPerPage = 8;
        let base64BannerImage = "";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            await fetchBanners();
        });

        async function fetchBanners() {
            try {
                const docRef = doc(db, "pengaturan", "global");
                const docSnap = await getDoc(docRef);
                
                allBanners = [];
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.bannersList && Array.isArray(data.bannersList)) {
                        allBanners = data.bannersList;
                    } else if (data.bannerTitle) {
                        allBanners.push({
                            id: 'default_1',
                            title: data.bannerTitle,
                            image: data.bannerImage || "",
                            active: true
                        });
                    }
                }
                filteredBanners = [...allBanners];
                renderTable();
            } catch (error) {
                console.error("Gagal memuat banner:", error);
            }
        }

        window.renderTable = function() {
            const tbody = document.getElementById('bannerTableBody');
            tbody.innerHTML = "";

            if (filteredBanners.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400">Tidak ada data banner ditemukan.</td></tr>`;
                renderPagination(0);
                document.getElementById('bulkDeleteBtn').classList.add('hidden');
                return;
            }

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedData = filteredBanners.slice(start, end);

            paginatedData.forEach((item) => {
                const imgHtml = item.image 
                    ? `<img src="${item.image}" class="w-24 h-14 object-cover border shadow-sm">` 
                    : `<div class="w-24 h-14 bg-slate-100 flex items-center justify-center text-[10px] text-slate-400 border">No Image</div>`;
                
                const checkedStatus = item.active !== false ? 'checked' : '';

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 transition">
                        <td class="p-3 text-center"><input type="checkbox" class="row-checkbox cursor-pointer" data-id="${item.id}" onchange="checkBulkButton()"></td>
                        <td class="p-3">${imgHtml}</td>
                        <td class="p-3 font-medium text-slate-800">${item.title}</td>
                        <td class="p-3 text-center">
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${checkedStatus} onchange="toggleStatus('${item.id}')" class="sr-only peer">
                                <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-900"></div>
                            </label>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="deleteSingleBanner('${item.id}')" class="bg-rose-500 hover:bg-rose-600 text-white p-2 rounded text-xs transition cursor-pointer" title="Hapus Banner">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            renderPagination(filteredBanners.length);
            checkBulkButton();
        }

        window.renderPagination = function(totalData) {
            const totalPages = Math.ceil(totalData / rowsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startRange = totalData === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
            const endRange = Math.min(currentPage * rowsPerPage, totalData);
            document.getElementById('paginationInfo').textContent = `Menampilkan ${startRange} sampai ${endRange} dari ${totalData} data`;

            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || totalData === 0;

            const pageNumbersContainer = document.getElementById('pageNumbers');
            pageNumbersContainer.innerHTML = "";

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = i === currentPage ? 'bg-indigo-900 text-white font-semibold' : 'border border-slate-300 hover:bg-slate-50 text-slate-700';
                pageNumbersContainer.innerHTML += `<button onclick="changePage(${i})" class="px-3 py-1.5 text-xs transition ${activeClass}">${i}</button>`;
            }
        }

        window.changePage = function(page) {
            const totalPages = Math.ceil(filteredBanners.length / rowsPerPage) || 1;
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        window.filterBanners = function() {
            const keyword = document.getElementById('searchBanner').value.toLowerCase();
            filteredBanners = allBanners.filter(b => b.title.toLowerCase().includes(keyword));
            currentPage = 1;
            renderTable();
        }

        window.toggleSelectAll = function(masterCheckbox) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
            checkBulkButton();
        }

        window.checkBulkButton = function() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const bulkBtn = document.getElementById('bulkDeleteBtn');
            if (checkedBoxes.length > 0) {
                bulkBtn.classList.remove('hidden');
                bulkBtn.classList.add('flex');
            } else {
                bulkBtn.classList.remove('flex');
                bulkBtn.classList.add('hidden');
            }
        }

        window.toggleStatus = async function(id) {
            const banner = allBanners.find(b => b.id === id);
            if (banner) {
                banner.active = !banner.active;
                await saveBannersToFirestore(false);
            }
        }

        // Hapus Satu Banner
        window.deleteSingleBanner = async function(id) {
            const result = await Swal.fire({
                title: 'Hapus Banner?',
                text: "Data banner ini akan dihapus permanen.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal'
            });

            if (result.isConfirmed) {
                allBanners = allBanners.filter(b => b.id !== id);
                await saveBannersToFirestore(true);
            }
        }

        // Hapus Banner Terpilih (Bulk Delete)
        window.deleteSelectedBanners = async function() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const idsToDelete = Array.from(checkedBoxes).map(cb => cb.getAttribute('data-id'));

            if (idsToDelete.length === 0) return;

            const result = await Swal.fire({
                title: `Hapus ${idsToDelete.length} Banner?`,
                text: "Banner yang dipilih akan dihapus permanen.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Hapus Semua!',
                cancelButtonText: 'Batal'
            });

            if (result.isConfirmed) {
                allBanners = allBanners.filter(b => !idsToDelete.includes(b.id));
                document.getElementById('selectAll').checked = false;
                await saveBannersToFirestore(true);
            }
        }

        window.openBannerModal = function() {
            document.getElementById('formBannerModal').reset();
            document.getElementById('bannerPreviewContainer').classList.add('hidden');
            base64BannerImage = "";
            document.getElementById('bannerModal').classList.remove('hidden');
        };

        window.closeBannerModal = function() {
            document.getElementById('bannerModal').classList.add('hidden');
        };

        // Kompres Gambar Otomatis
        const inputBannerImage = document.getElementById('inputBannerImage');
        inputBannerImage.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width = Math.round((width * MAX_HEIGHT) / height);
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    let quality = 0.8;
                    let dataUrl = canvas.toDataURL('image/jpeg', quality);

                    while (dataUrl.length > 300000 && quality > 0.1) {
                        quality -= 0.1;
                        dataUrl = canvas.toDataURL('image/jpeg', quality);
                    }

                    base64BannerImage = dataUrl;
                    document.getElementById('bannerImgPreview').src = base64BannerImage;
                    document.getElementById('bannerPreviewContainer').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Simpan Data Banner Baru ke Firestore
        document.getElementById('formBannerModal').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('inputBannerTitle').value;

            if (!base64BannerImage) {
                Swal.fire('Perhatian', 'Silakan pilih foto banner terlebih dahulu.', 'warning');
                return;
            }

            const newBanner = {
                id: 'banner_' + Date.now(),
                title: title,
                image: base64BannerImage,
                active: true
            };

            allBanners.unshift(newBanner);
            await saveBannersToFirestore(true);
            closeBannerModal();
        });

        async function saveBannersToFirestore(showAlert = true) {
            try {
                if (showAlert) {
                    Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                }

                const docRef = doc(db, "pengaturan", "global");
                await setDoc(docRef, { 
                    bannersList: allBanners,
                    bannerTitle: allBanners.length > 0 ? allBanners[0].title : "",
                    bannerDesc: "",
                    bannerImage: allBanners.length > 0 ? allBanners[0].image : ""
                }, { merge: true });

                filteredBanners = [...allBanners];
                renderTable();

                if (showAlert) {
                    Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Perubahan berhasil disimpan.', timer: 1500, showConfirmButton: false });
                }
            } catch (error) {
                console.error("Gagal menyimpan:", error);
                if (showAlert) {
                    Swal.fire({ icon: 'error', title: 'Gagal', text: 'Terjadi kesalahan saat menyimpan ke database.' });
                }
            }
        }
    </script>
</body>
</html>
