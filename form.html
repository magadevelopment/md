<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran - MAGA SWALAYAN (Merchandising)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-white rounded-xl p-1 shadow-inner flex items-center justify-center overflow-hidden border border-indigo-400">
                    <img src="maga.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wide">Pendaftaran Distributor</h1>
                    <p class="text-xs text-indigo-200">Maga Swalayan</p>
                </div>
            </div>
            
            <a href="dashboard.html" class="flex items-center gap-1.5 text-xs sm:text-sm bg-indigo-700 hover:bg-indigo-800 px-3.5 py-2 rounded-lg font-medium transition shadow-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Dashboard</span>
            </a>
        </div>
    </header>

    <!-- Main Container Formulir -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-6 flex-grow">
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
            <h2 class="text-xl font-bold text-slate-800 mb-6 border-b pb-3 flex items-center gap-2">
                <i class="fa-solid fa-file-pen text-indigo-600"></i>
                Formulir Pendaftaran Distributor
            </h2>

            <form id="formPendaftaran" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Distributor</label>
                    <input type="text" id="nama_distributor" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Masukkan nama distributor">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Penanggungjawab</label>
                    <input type="text" id="penanggungjawab" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Nama penanggungjawab">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nomor HP Kantor / Admin</label>
                    <input type="tel" id="no_hp_kantor" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Contoh: 081234567890">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Sales</label>
                    <input type="text" id="nama_sales" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Masukkan nama sales">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">No HP Sales</label>
                    <input type="tel" id="no_hp_sales" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Contoh: 081234567891">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Supervisor</label>
                    <input type="text" id="nama_supervisor" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Masukkan nama supervisor">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">No HP Supervisor</label>
                    <input type="tel" id="no_hp_supervisor" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Contoh: 081234567892">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Produk yang Dibawa</label>
                    <textarea id="nama_produk" rows="3" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Daftar produk yang dibawa"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Jatuh Tempo</label>
                    <input type="text" id="jatuh_tempo" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Contoh: 30 Hari / 15 Desember 2026">
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 cursor-pointer">
                        <i class="fa-solid fa-paper-plane mr-2"></i> Kirim Pendaftaran
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Overlay Loading Page -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-sm w-full mx-4">
            <div class="animate-spin rounded-full h-16 w-16 border-4 border-indigo-600 border-t-transparent mb-4"></div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">Menyimpan Data...</h3>
            <p class="text-sm text-slate-500 text-center">Mohon tunggu, sedang mengirim data ke database.</p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t bg-white mt-auto">
        &copy; 2026 MAGA SWALAYAN. All rights reserved.
    </footer>

    <!-- Firebase Script -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUserUid = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                currentUserUid = user.uid; // Simpan UID user yang login
            }
        });

        const formPendaftaran = document.getElementById('formPendaftaran');
        const loadingOverlay = document.getElementById('loadingOverlay');

        formPendaftaran.addEventListener('submit', async (e) => {
            e.preventDefault();
            loadingOverlay.classList.remove('hidden');

            const formData = {
                userId: currentUserUid, // Rekam UID pembuat data
                namaDistributor: document.getElementById('nama_distributor').value,
                penanggungjawab: document.getElementById('penanggungjawab').value,
                noHpKantor: document.getElementById('no_hp_kantor').value,
                namaSales: document.getElementById('nama_sales').value,
                noHpSales: document.getElementById('no_hp_sales').value,
                namaSupervisor: document.getElementById('nama_supervisor').value,
                noHpSupervisor: document.getElementById('no_hp_supervisor').value,
                namaproduk: document.getElementById('nama_produk').value,
                jatuhTempo: document.getElementById('jatuh_tempo').value,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "pendaftaran_distributor"), formData);
                loadingOverlay.classList.add('hidden');

                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: 'Data pendaftaran distributor berhasil disimpan.',
                    confirmButtonColor: '#4f46e5'
                }).then(() => {
                    formPendaftaran.reset();
                });

            } catch (error) {
                console.error("Gagal menyimpan data: ", error);
                loadingOverlay.classList.add('hidden');
                
                Swal.fire({
                    icon: 'error',
                    title: 'Gagal!',
                    text: 'Terjadi kesalahan saat menyimpan data.',
                    confirmButtonColor: '#dc2626'
                });
            }
        });
    </script>
</body>
</html>
