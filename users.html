<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pengguna / Tamu - MAGA SWALAYAN (Merchandising)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 bg-white rounded-xl p-1 shadow-inner flex items-center justify-center overflow-hidden border border-indigo-400">
                    <img src="maga.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wide">Daftar Pengguna & Tamu</h1>
                    <p class="text-xs text-indigo-200">Maga Swalayan</p>
                </div>
            </div>
            
            <a href="dashboard.html" class="flex items-center gap-1.5 text-xs sm:text-sm bg-indigo-700 hover:bg-indigo-800 px-3.5 py-2 rounded-lg font-medium transition shadow-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Dashboard</span>
            </a>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-6xl w-full mx-auto p-4 sm:p-6 my-6 flex-grow">
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b pb-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-users-gear text-indigo-600"></i>
                        Manajemen Akun Pengguna
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">Kelola hak akses akun Administrator dan Tamu yang masuk ke aplikasi.</p>
                </div>
            </div>

            <!-- Tab Navigation Buttons -->
            <div class="flex border-b border-slate-200 mb-6 gap-2">
                <button id="tabAdminBtn" onclick="switchTab('admin')" class="px-5 py-2.5 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 transition cursor-pointer">
                    <i class="fa-solid fa-shield-halved"></i> Administrator <span id="countAdmin" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
                <button id="tabTamuBtn" onclick="switchTab('tamu')" class="px-5 py-2.5 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition cursor-pointer">
                    <i class="fa-solid fa-user-clock"></i> Tamu / User <span id="countTamu" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>

            <!-- Tabel Data Pengguna -->
            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-indigo-50 text-indigo-900 text-xs sm:text-sm uppercase font-semibold">
                            <th class="p-3.5 sm:p-4">No</th>
                            <th class="p-3.5 sm:p-4">Profil</th>
                            <th class="p-3.5 sm:p-4">Nama Pengguna</th>
                            <th class="p-3.5 sm:p-4">Email</th>
                            <th class="p-3.5 sm:p-4">Role / Hak Akses</th>
                            <th class="p-3.5 sm:p-4">Waktu Masuk</th>
                            <th class="p-3.5 sm:p-4 text-center">Aksi (Ubah Role)</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-slate-200 text-xs sm:text-sm text-slate-700">
                        <tr>
                            <td colspan="7" class="text-center py-6 text-slate-400">Memuat data pengguna...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t bg-white mt-auto">
        &copy; 2026 MAGA SWALAYAN. All rights reserved.
    </footer>

    <!-- Script Pengambilan & Logika Tab Firestore -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const userTableBody = document.getElementById('userTableBody');
        const countAdmin = document.getElementById('countAdmin');
        const countTamu = document.getElementById('countTamu');
        const tabAdminBtn = document.getElementById('tabAdminBtn');
        const tabTamuBtn = document.getElementById('tabTamuBtn');

        let allUsersData = [];
        let currentTab = 'admin'; // Default tab aktif

        // Proteksi Halaman
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            await fetchUsers();
        });

        async function fetchUsers() {
            try {
                const q = query(collection(db, "users"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                allUsersData = [];
                querySnapshot.forEach((docSnap) => {
                    allUsersData.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderTable();
            } catch (error) {
                console.error("Gagal memuat pengguna:", error);
                userTableBody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-rose-500">Gagal memuat data dari database.</td></tr>`;
            }
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            if (tab === 'admin') {
                tabAdminBtn.className = "px-5 py-2.5 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 transition cursor-pointer";
                tabTamuBtn.className = "px-5 py-2.5 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition cursor-pointer";
            } else {
                tabTamuBtn.className = "px-5 py-2.5 font-semibold text-sm border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2 transition cursor-pointer";
                tabAdminBtn.className = "px-5 py-2.5 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 transition cursor-pointer";
            }
            renderTable();
        }

        function renderTable() {
            // Filter data berdasarkan tab aktif
            const filteredUsers = allUsersData.filter(user => {
                const role = user.role || "User";
                if (currentTab === 'admin') {
                    return role === "Administrator";
                } else {
                    return role !== "Administrator"; // Kategori Tamu / User biasa
                }
            });

            // Update badge hitung jumlah
            const totalAdmin = allUsersData.filter(u => (u.role || "User") === "Administrator").length;
            const totalTamu = allUsersData.length - totalAdmin;
            countAdmin.textContent = totalAdmin;
            countTamu.textContent = totalTamu;

            userTableBody.innerHTML = "";

            if (filteredUsers.length === 0) {
                userTableBody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-400">Tidak ada data pada tab ini.</td></tr>`;
                return;
            }

            let no = 1;
            filteredUsers.forEach((data) => {
                const docId = data.id;
                const nama = data.nama || "Tanpa Nama";
                const email = data.email || "-";
                const role = data.role || "User";
                const photoURL = data.photoURL;
                
                let formattedDate = "-";
                if (data.createdAt && data.createdAt.toDate) {
                    formattedDate = data.createdAt.toDate().toLocaleString('id-ID', {
                        dateStyle: 'medium',
                        timeStyle: 'short'
                    });
                }

                let avatarHtml = `<div class="w-9 h-9 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-xs uppercase">${email.charAt(0)}</div>`;
                if (photoURL) {
                    avatarHtml = `<img src="${photoURL}" alt="Avatar" class="w-9 h-9 rounded-full object-cover shadow-sm border">`;
                }

                const roleBadge = role === "Administrator" 
                    ? `<span class="bg-purple-100 text-purple-700 font-semibold px-2.5 py-1 rounded-full text-xs border border-purple-200">Administrator</span>`
                    : `<span class="bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-full text-xs border border-blue-200">User / Tamu</span>`;

                const actionButton = role === "Administrator"
                    ? `<button onclick="ubahRole('${docId}', 'User')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm transition cursor-pointer"><i class="fa-solid fa-user mr-1"></i> Jadikan User</button>`
                    : `<button onclick="ubahRole('${docId}', 'Administrator')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow-sm transition cursor-pointer"><i class="fa-solid fa-shield-halved mr-1"></i> Jadikan Admin</button>`;

                const row = `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3.5 sm:p-4 font-medium">${no++}</td>
                        <td class="p-3.5 sm:p-4">${avatarHtml}</td>
                        <td class="p-3.5 sm:p-4 font-semibold text-slate-800">${nama}</td>
                        <td class="p-3.5 sm:p-4 text-slate-600">${email}</td>
                        <td class="p-3.5 sm:p-4">${roleBadge}</td>
                        <td class="p-3.5 sm:p-4 text-slate-500 text-xs">${formattedDate}</td>
                        <td class="p-3.5 sm:p-4 text-center">${actionButton}</td>
                    </tr>
                `;
                userTableBody.innerHTML += row;
            });
        }

        // Fungsi Global untuk Mengubah Role Pengguna
        window.ubahRole = async function(docId, newRole) {
            const result = await Swal.fire({
                title: 'Konfirmasi Ubah Role',
                text: `Apakah Anda yakin ingin mengubah hak akses akun ini menjadi ${newRole}?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4f46e5',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Ubah',
                cancelButtonText: 'Batal'
            });

            if (result.isConfirmed) {
                try {
                    Swal.fire({
                        title: 'Memproses...',
                        text: 'Menyimpan perubahan ke database',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    const userRef = doc(db, "users", docId);
                    await updateDoc(userRef, { role: newRole });

                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: `Hak akses berhasil diubah menjadi ${newRole}.`,
                        timer: 1500,
                        showConfirmButton: false
                    });

                    await fetchUsers();
                } catch (error) {
                    console.error("Gagal mengubah role:", error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal',
                        text: 'Terjadi kesalahan saat memperbarui role.',
                        confirmButtonColor: '#dc2626'
                    });
                }
            }
        };
    </script>
</body>
</html>
