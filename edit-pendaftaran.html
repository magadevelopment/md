<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Pendaftaran - MAGA SWALAYAN (Merchandising)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white p-1 shadow-inner flex items-center justify-center overflow-hidden border border-indigo-400 shrink-0">
                    <img src="maga.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wide">Edit Data Pendaftaran</h1>
                    <p class="text-[11px] sm:text-xs text-indigo-200">Maga Swalayan</p>
                </div>
            </div>
            
            <a href="dashboard.html" class="flex items-center gap-1.5 text-xs sm:text-sm bg-indigo-700 hover:bg-indigo-800 px-3.5 py-2 font-medium transition shadow-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Dashboard</span>
            </a>
        </div>
    </header>

    <!-- Konten Utama (Kotak Siku) -->
    <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 my-6 flex-grow">
        <div class="bg-white shadow-xl p-6 sm:p-8">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b pb-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                        Daftar Pendaftaran Anda
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">Anda hanya dapat melihat dan mengubah data yang diinput oleh akun Anda sendiri.</p>
                </div>
                <div class="bg-indigo-50 text-indigo-700 font-semibold text-xs px-3 py-2 border border-indigo-100">
                    Total Data Anda: <span id="totalData">0</span>
                </div>
            </div>

            <!-- Kontainer Kartu Responsif (Tampil sebagai card di HP maupun Desktop) -->
            <div id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-8 text-slate-400">
                    Memuat data pendaftaran...
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t bg-white mt-auto">
        &copy; 2026 MAGA SWALAYAN. All rights reserved.
    </footer>

    <!-- Script Firestore & Logika Edit -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const cardContainer = document.getElementById('cardContainer');
        const totalData = document.getElementById('totalData');
        let currentUserId = null;
        let currentUserEmail = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            currentUserId = user.uid;
            currentUserEmail = user.email;
            await loadMyData();
        });

        async function loadMyData() {
            try {
                const q = query(collection(db, "pendaftaran_distributor"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                cardContainer.innerHTML = "";
                let myDataList = [];

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.userId === currentUserId || data.email === currentUserEmail) {
                        myDataList.push({ id: docSnap.id, ...data });
                    }
                });

                totalData.textContent = myDataList.length;

                if (myDataList.length === 0) {
                    cardContainer.innerHTML = `
                        <div class="col-span-full text-center py-12 text-slate-400 border border-dashed border-slate-300 p-8">
                            <i class="fa-solid fa-folder-open text-4xl mb-2 text-slate-300"></i>
                            <p class="text-sm">Belum ada data pendaftaran yang Anda input.</p>
                        </div>
                    `;
                    return;
                }

                let no = 1;
                myDataList.forEach((item) => {
                    const cardHtml = `
                        <div class="bg-white border border-slate-200 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between relative">
                            <div>
                                <!-- Header Kartu -->
                                <div class="flex justify-between items-start gap-2 mb-3 border-b pb-2">
                                    <div>
                                        <span class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 border border-indigo-100">#${no++}</span>
                                        <h3 class="text-base font-bold text-slate-800 mt-1">${item.namaDistributor || '-'}</h3>
                                    </div>
                                    <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 border border-indigo-100 shrink-0">
                                        <i class="fa-solid fa-clock mr-1"></i>${item.jatuhTempo || '-'}
                                    </span>
                                </div>

                                <!-- Detail Informasi -->
                                <div class="space-y-2 text-xs sm:text-sm text-slate-600 mb-4">
                                    <div class="flex items-start gap-2">
                                        <i class="fa-solid fa-user-tie text-indigo-500 mt-0.5 w-4"></i>
                                        <div>
                                            <span class="font-semibold text-slate-700">PJ:</span> ${item.penanggungjawab || '-'} 
                                            <span class="text-slate-400 text-xs">(${item.noHpKantor || '-'})</span>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-2">
                                        <i class="fa-solid fa-user-tag text-indigo-500 mt-0.5 w-4"></i>
                                        <div>
                                            <span class="font-semibold text-slate-700">Sales:</span> ${item.namaSales || '-'} 
                                            <span class="text-slate-400 text-xs">(${item.noHpSales || '-'})</span>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-2">
                                        <i class="fa-solid fa-user-gear text-indigo-500 mt-0.5 w-4"></i>
                                        <div>
                                            <span class="font-semibold text-slate-700">Supervisor:</span> ${item.namaSupervisor || '-'} 
                                            <span class="text-slate-400 text-xs">(${item.noHpSupervisor || '-'})</span>
                                        </div>
                                    </div>
                                    <div class="flex items-start gap-2 pt-1 border-t border-slate-100">
                                        <i class="fa-solid fa-box text-indigo-500 mt-0.5 w-4"></i>
                                        <div>
                                            <span class="font-semibold text-slate-700">Produk:</span> 
                                            <p class="text-slate-600 mt-0.5 whitespace-pre-line">${item.namaproduk || '-'}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Tombol Aksi Edit -->
                            <div class="pt-3 border-t border-slate-100 flex justify-end">
                                <button onclick='bukaModalEdit(${JSON.stringify(item)})' class="w-full bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold py-2.5 px-4 shadow-sm transition cursor-pointer flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit Data Ini
                                </button>
                            </div>
                        </div>
                    `;
                    cardContainer.innerHTML += cardHtml;
                });

            } catch (error) {
                console.error("Gagal memuat data:", error);
                cardContainer.innerHTML = `<div class="col-span-full text-center py-6 text-rose-500">Gagal memuat data dari database.</div>`;
            }
        }

        // Fungsi Membuka SweetAlert Form Edit
        window.bukaModalEdit = async function(item) {
            const { value: formValues } = await Swal.fire({
                title: 'Edit Data Pendaftaran',
                html: `
                    <div class="text-left space-y-3 text-sm">
                        <div>
                            <label class="font-semibold text-slate-700">Nama Distributor</label>
                            <input id="swal-namaDistributor" class="swal2-input !m-0 !w-full !text-sm" value="${item.namaDistributor || ''}">
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">Penanggungjawab</label>
                            <input id="swal-penanggungjawab" class="swal2-input !m-0 !w-full !text-sm" value="${item.penanggungjawab || ''}">
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">No HP Kantor / Admin</label>
                            <input id="swal-noHpKantor" class="swal2-input !m-0 !w-full !text-sm" value="${item.noHpKantor || ''}">
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">Nama Sales</label>
                            <input id="swal-namaSales" class="swal2-input !m-0 !w-full !text-sm" value="${item.namaSales || ''}">
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">No HP Sales</label>
                            <input id="swal-noHpSales" class="swal2-input !m-0 !w-full !text-sm" value="${item.noHpSales || ''}">
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">Nama Supervisor</label>
                            <input id="swal-namaSupervisor" class="swal2-input !m-0 !w-full !text-sm" value="${item.namaSupervisor || ''}">
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">No HP Supervisor</label>
                            <input id="swal-noHpSupervisor" class="swal2-input !m-0 !w-full !text-sm" value="${item.noHpSupervisor || ''}">
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">Nama Produk</label>
                            <textarea id="swal-namaProduk" class="swal2-textarea !m-0 !w-full !text-sm">${item.namaproduk || ''}</textarea>
                        </div>
                        <div>
                            <label class="font-semibold text-slate-700">Jatuh Tempo</label>
                            <input id="swal-jatuhTempo" class="swal2-input !m-0 !w-full !text-sm" value="${item.jatuhTempo || ''}">
                        </div>
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Simpan Perubahan',
                cancelButtonText: 'Batal',
                confirmButtonColor: '#4f46e5',
                preConfirm: () => {
                    return {
                        namaDistributor: document.getElementById('swal-namaDistributor').value,
                        penanggungjawab: document.getElementById('swal-penanggungjawab').value,
                        noHpKantor: document.getElementById('swal-noHpKantor').value,
                        namaSales: document.getElementById('swal-namaSales').value,
                        noHpSales: document.getElementById('swal-noHpSales').value,
                        namaSupervisor: document.getElementById('swal-namaSupervisor').value,
                        noHpSupervisor: document.getElementById('swal-noHpSupervisor').value,
                        namaproduk: document.getElementById('swal-namaProduk').value,
                        jatuhTempo: document.getElementById('swal-jatuhTempo').value,
                    }
                }
            });

            if (formValues) {
                try {
                    Swal.fire({
                        title: 'Menyimpan...',
                        text: 'Memperbarui data di database',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    const docRef = doc(db, "pendaftaran_distributor", item.id);
                    await updateDoc(docRef, formValues);

                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: 'Data pendaftaran berhasil diperbarui.',
                        timer: 1500,
                        showConfirmButton: false
                    });

                    await loadMyData();
                } catch (error) {
                    console.error("Gagal mengupdate:", error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal',
                        text: 'Terjadi kesalahan saat memperbarui data.',
                        confirmButtonColor: '#dc2626'
                    });
                }
            }
        };
    </script>
</body>
</html>
