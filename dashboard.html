<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SWALAYAN MAGA (Merchandising)</title>
</head>
<body>
    <!-- KONTEN UTAMA DASHBOARD SAJA -->
    <main class="w-full px-4 sm:px-6 lg:px-8 py-6 flex-grow">
        
        <!-- Bar Info Akun & Role -->
        <div class="bg-indigo-900 text-white shadow-md p-4 sm:p-6 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span id="roleBadgeLabel" class="bg-indigo-700 text-indigo-200 text-[10px] sm:text-xs font-semibold px-2.5 py-1 uppercase tracking-wider">MEMUAT ROLE...</span>
                <h2 id="welcomeText" class="text-lg sm:text-2xl font-bold mt-2">Memuat akun...</h2>
            </div>
            <div class="text-xs text-indigo-200 bg-indigo-800/60 px-3 py-2 border border-indigo-700">
                <i class="fa-solid fa-clock mr-1"></i> Sistem Merchandising Aktif
            </div>
        </div>

        <!-- SLIDER BANNER DINAMIS -->
        <div id="bannerWrapper" class="mb-8 relative">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Banner & Informasi Utama</h3>
                <div class="flex gap-1.5">
                    <button id="btnPrevSlide" type="button" class="w-8 h-8 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 flex items-center justify-center shadow-sm transition cursor-pointer" title="Sebelumnya">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                    <button id="btnNextSlide" type="button" class="w-8 h-8 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 flex items-center justify-center shadow-sm transition cursor-pointer" title="Selanjutnya">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            </div>

            <div id="bannerSliderContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 transition-all duration-300">
                <div class="bg-white border border-slate-200 p-4 text-center text-slate-400 text-xs shadow-sm">Memuat banner...</div>
            </div>
        </div>

        <!-- Bagian Menu Navigasi Cepat -->
        <div class="mb-4">
            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Menu Pintasan Cepat</h3>
            <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                <a href="form.html" data-spa class="bg-white hover:bg-indigo-50/40 border border-slate-200 hover:border-indigo-300 p-5 sm:p-6 shadow-sm hover:shadow-md transition flex items-center justify-between group">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 flex items-center justify-center text-xl group-hover:scale-110 transition shrink-0">
                            <i class="fa-solid fa-file-circle-plus"></i>
                        </div>
                        <div>
                            <h4 class="text-base font-bold text-slate-800 group-hover:text-indigo-600 transition">Daftar Pendaftaran</h4>
                            <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Tambah data distributor dan produk baru</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-400 group-hover:translate-x-1 transition"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- SKRIP KHUSUS HALAMAN DASHBOARD -->
    <script type="module">
        import { db } from "./firebase.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let activeBanners = [];
        let currentSlideIndex = 0;
        let autoplayInterval = null;

        async function loadActiveBanners() {
            try {
                const docRef = doc(db, "pengaturan", "global");
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.bannersList && Array.isArray(data.bannersList)) {
                        activeBanners = data.bannersList.filter(b => b.active !== false);
                    } else if (data.bannerTitle && data.bannerImage) {
                        activeBanners = [{
                            id: 'default_1',
                            title: data.bannerTitle,
                            image: data.bannerImage,
                            active: true
                        }];
                    }
                }
                renderBannerSlider();
                startAutoplay();
            } catch (error) {
                console.error("Gagal memuat slider banner:", error);
                const bannerContainer = document.getElementById('bannerSliderContainer');
                if(bannerContainer) bannerContainer.innerHTML = `<div class="col-span-full text-center py-4 text-slate-400 text-xs">Gagal memuat banner.</div>`;
            }
        }

        function renderBannerSlider() {
            const container = document.getElementById('bannerSliderContainer');
            if(!container) return;
            container.innerHTML = "";

            if (activeBanners.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-6 text-slate-400 text-xs bg-white border border-slate-200">Tidak ada banner aktif saat ini.</div>`;
                return;
            }

            const isDesktop = window.innerWidth >= 1024;
            const itemsPerPage = isDesktop ? 4 : 1;

            if (currentSlideIndex >= activeBanners.length) currentSlideIndex = 0;

            let visibleBanners = [];
            for (let i = 0; i < itemsPerPage; i++) {
                let index = (currentSlideIndex + i) % activeBanners.length;
                visibleBanners.push(activeBanners[index]);
            }

            visibleBanners.forEach(item => {
                const imgTag = item.image 
                    ? `<img src="${item.image}" alt="${item.title}" class="w-full h-32 sm:h-36 object-cover border">` 
                    : `<div class="w-full h-32 sm:h-36 bg-slate-100 flex items-center justify-center text-xs text-slate-400 border">No Image</div>`;

                container.innerHTML += `
                    <div class="bg-white border border-slate-200 p-3 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            ${imgTag}
                            <h4 class="text-xs sm:text-sm font-bold text-slate-800 mt-2.5 truncate" title="${item.title}">${item.title}</h4>
                        </div>
                    </div>
                `;
            });
        }

        function nextBannerSlide() {
            if (activeBanners.length === 0) return;
            currentSlideIndex = (currentSlideIndex + 1) % activeBanners.length;
            renderBannerSlider();
        }

        function prevBannerSlide() {
            if (activeBanners.length === 0) return;
            currentSlideIndex = (currentSlideIndex - 1 + activeBanners.length) % activeBanners.length;
            renderBannerSlider();
        }

        function startAutoplay() {
            if (autoplayInterval) clearInterval(autoplayInterval);
            autoplayInterval = setInterval(() => {
                nextBannerSlide();
            }, 3500);
        }

        function pauseAutoplay() {
            if (autoplayInterval) clearInterval(autoplayInterval);
        }

        function resumeAutoplay() {
            startAutoplay();
        }

        // Pasang Event Listener secara aman via JavaScript setelah elemen dimuat
        document.getElementById('btnNextSlide')?.addEventListener('click', nextBannerSlide);
        document.getElementById('btnPrevSlide')?.addEventListener('click', prevBannerSlide);
        
        const wrapper = document.getElementById('bannerWrapper');
        if (wrapper) {
            wrapper.addEventListener('mouseenter', pauseAutoplay);
            wrapper.addEventListener('mouseleave', resumeAutoplay);
        }

        window.addEventListener('resize', () => {
            renderBannerSlider();
        });

        // Jalankan saat halaman dashboard dimuat
        loadActiveBanners();
    </script>
</body>
</html>
