<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pendaftaran - MAGA SWALAYAN (Merchandising)</title>
</head>
<body>
    <main class="w-full">
        <div class="bg-white shadow-xl p-6 sm:p-8 rounded-none">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b pb-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-600"></i>
                        Semua Data Pendaftaran Masuk
                    </h2>
                    <p class="text-xs sm:text-sm text-slate-500 mt-1">Pantau seluruh data distributor dan produk yang terdaftar dalam sistem.</p>
                </div>
                
                <div class="flex flex-wrap items-center gap-3">
                    <!-- Tombol Download Excel -->
                    <button id="btnDownloadExcel" onclick="downloadExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold px-4 py-2 flex items-center gap-2 transition shadow-sm cursor-pointer">
                        <i class="fa-solid fa-file-excel"></i>
                        <span>Download Excel</span>
                    </button>

                    <div class="bg-indigo-50 text-indigo-700 font-semibold text-xs px-3 py-2 border border-indigo-100">
                        Total Data: <span id="totalData">0</span>
                    </div>
                </div>
            </div>

            <!-- Kontainer Kartu Responsif -->
            <div id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-8 text-slate-400">
                    Memuat data pendaftaran...
                </div>
            </div>
        </div>
    </main>
</body>
</html>
