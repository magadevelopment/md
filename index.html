<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MAGA SWALAYAN (Merchandising)</title>
    
    <!-- DETEKSI OTOMATIS: Tag <base> hanya aktif di GitHub Pages, aman di Localhost -->
    <script>
        if (window.location.hostname.includes('github.io')) {
            const base = document.createElement('base');
            base.href = '/md/';
            document.head.prepend(base);
        }
    </script>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#312e81">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Maga">
    <link rel="apple-touch-icon" href="maga.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen flex items-center justify-center font-sans px-4 sm:px-6 bg-cover bg-center bg-no-repeat relative" style="background-image: url('wallpaper.jpeg');">

    <!-- Overlay Gelap Tipis -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-xs"></div>

    <!-- Card Login Container (Kotak Siku) -->
    <div class="relative z-10 w-full max-w-sm sm:max-w-md bg-white/95 backdrop-blur-md shadow-2xl p-6 sm:p-8 text-center border border-white/25 mx-auto">
        <div class="mb-6">
            <!-- Logo Maga (Kotak Siku) -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-indigo-50 flex items-center justify-center mx-auto mb-4 p-2 shadow-inner border border-indigo-100 overflow-hidden">
                <img src="maga.png" alt="Logo Maga" class="w-full h-full object-contain">
            </div>
            <h1 class="text-lg sm:text-2xl font-bold text-slate-800 tracking-wide">MAGA SWALAYAN</h1>
            <p class="text-xs sm:text-sm font-medium text-indigo-600 mt-0.5">(Merchandising)</p>
            <p class="text-xs text-slate-500 mt-2">Silakan masuk menggunakan akun Google Anda</p>
        </div>

        <!-- Tombol Login dengan Google (Kotak Siku) -->
        <button id="btnLoginGoogle" type="button" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 sm:py-3.5 shadow-sm transition duration-200 cursor-pointer text-sm sm:text-base">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.84 0 11.6s.43 3.48 1.18 5.00l4.09-2.36z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Masuk dengan Google
        </button>
    </div>

    <!-- Pendaftaran Service Worker untuk PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker PWA berhasil terdaftar di index:', reg.scope))
                    .catch((err) => console.log('Pendaftaran Service Worker PWA gagal:', err));
            });
        }
    </script>

    <!-- Firebase Script & Logika Login -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const btnLoginGoogle = document.getElementById('btnLoginGoogle');

        btnLoginGoogle.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            Swal.fire({
                title: 'Menghubungkan...',
                text: 'Membuka jendela autentikasi Google',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                const usersRef = collection(db, "users");
                const userSnapshot = await getDocs(usersRef);
                
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                let assignedRole = "User";

                if (!userDoc.exists()) {
                    assignedRole = userSnapshot.empty ? "Administrator" : "User";

                    await setDoc(userDocRef, {
                        uid: user.uid,
                        nama: user.displayName || "Tanpa Nama",
                        email: user.email,
                        photoURL: user.photoURL || "",
                        role: assignedRole,
                        createdAt: serverTimestamp()
                    });
                } else {
                    assignedRole = userDoc.data().role || "User";
                }

                // SIMPAN ROLE KE LOCALSTORAGE UNTUK AKSELERASI RENDER DASHBOARD
                localStorage.setItem('userRole', assignedRole);

                Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil!',
                    text: 'Mengalihkan ke Dashboard...',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    // DIARAHKAN KE LAYOUT UTAMA AGAR SIDEBAR & HEADER LENGKAP TAMPIL
                    window.location.href = 'layout.html';
                });

            } catch (error) {
                console.error(error);
                Swal.fire({
                    icon: 'error',
                    title: 'Login Google Gagal',
                    text: error.message,
                    confirmButtonColor: '#dc2626'
                });
            }
        });
    </script>
</body>
</html>
